<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!--
  ╔══════════════════════════════════════════════════════════╗
  ║    LBF STUDIO — EMAIL SIGNATURE  (Outlook for Windows)  ║
  ╠══════════════════════════════════════════════════════════╣
  ║  Uses PNG images — works in ALL email clients.          ║
  ║                                                         ║
  ║  ⚠️  SETUP REQUIRED BEFORE USE                          ║
  ║                                                         ║
  ║  1. Upload both files from the /elements folder to      ║
  ║     your web server (e.g. Cloudflare, your own host):   ║
  ║                                                         ║
  ║     elements/Logo@2x.png    → hosted URL                ║
  ║     elements/IG Icon@2x.png → hosted URL                ║
  ║                                                         ║
  ║  2. Replace the two image URLs marked with 🔗 below.   ║
  ║                                                         ║
  ║  Suggested hosting path (if using lbf.studio):          ║
  ║    https://lbf.studio/assets/email/lbf-logo.png         ║
  ║    https://lbf.studio/assets/email/lbf-ig-icon.png      ║
  ║                                                         ║
  ║  WORKS IN:                                              ║
  ║    ✅  Outlook 2016 / 2019 / 2021 (Windows)             ║
  ║    ✅  Outlook 365 (Windows)                            ║
  ║    ✅  Outlook for Mac                                  ║
  ║    ✅  Outlook Web (OWA)                                ║
  ║    ✅  Gmail (web & app)                                ║
  ║    ✅  Apple Mail                                       ║
  ║    ✅  Yahoo Mail                                       ║
  ║    ✅  Thunderbird                                      ║
  ║                                                         ║
  ║  See README.md for installation instructions.           ║
  ╚══════════════════════════════════════════════════════════╝
  -->
</head>
<body style="margin:0;padding:0;background-color:#ffffff;">

<!-- ═══════════════════════════════════════════════════════════
     OUTER WRAPPER
     ═══════════════════════════════════════════════════════════ -->
<table role="presentation" cellpadding="0" cellspacing="0" border="0" width="370"
       style="width:370px;max-width:370px;background-color:#ffffff;border-collapse:collapse;mso-table-lspace:0pt;mso-table-rspace:0pt;">

  <!-- ─────────────────────────────────────────────────────────
       ROW 1 · Logo  +  Instagram / Watch Showreel
       ───────────────────────────────────────────────────────── -->
  <tr>

    <!-- LOGO — linked to website -->
    <td valign="middle" style="padding:33px 0 0 25px;vertical-align:middle;mso-padding-alt:33px 0px 0px 25px;">
      <a href="https://lbf.studio/" target="_blank" rel="noopener noreferrer"
         style="display:inline-block;line-height:0;text-decoration:none;border:0;outline:none;mso-hide:none;">
        <!--
          🔗 REPLACE THIS URL with your hosted logo image.
             Upload elements/Logo@2x.png to your web server.
             Example: https://lbf.studio/assets/email/lbf-logo.png
        -->
        <img src="https://lbf.studio/assets/email/lbf-logo.png"
             alt="let's be friends"
             width="127"
             height="16"
             style="display:block;border:0;outline:none;text-decoration:none;-ms-interpolation-mode:bicubic;width:127px;height:16px;" />
      </a>
    </td>

    <!-- INSTAGRAM + WATCH SHOWREEL -->
    <td valign="middle" align="right" style="padding:33px 20px 0 12px;vertical-align:middle;mso-padding-alt:33px 20px 0px 12px;">
      <table role="presentation" cellpadding="0" cellspacing="0" border="0"
             style="border-collapse:collapse;mso-table-lspace:0pt;mso-table-rspace:0pt;">
        <tr>

          <!-- Instagram icon -->
          <td valign="middle" style="vertical-align:middle;line-height:0;">
            <a href="https://www.instagram.com/letsbefriends.tv" target="_blank" rel="noopener noreferrer"
               style="display:inline-block;line-height:0;text-decoration:none;border:0;outline:none;">
              <!--
                🔗 REPLACE THIS URL with your hosted Instagram icon image.
                   Upload elements/IG Icon@2x.png to your web server.
                   Example: https://lbf.studio/assets/email/lbf-ig-icon.png
              -->
              <img src="https://lbf.studio/assets/email/lbf-ig-icon.png"
                   alt="Instagram"
                   width="16"
                   height="15"
                   style="display:block;border:0;outline:none;text-decoration:none;-ms-interpolation-mode:bicubic;width:16px;height:15px;" />
            </a>
          </td>

          <!-- Gap between icon and text link -->
          <td style="width:16px;font-size:0;line-height:0;" aria-hidden="true">&nbsp;</td>

          <!-- Watch Showreel link -->
          <td valign="middle" style="vertical-align:middle;">
            <a href="https://youtu.be/qkz4Nc359y0?si=-WkiAp7lSjDGaGZk" target="_blank" rel="noopener noreferrer"
               style="font-family:Arial,Helvetica,sans-serif;font-size:10px;line-height:15px;color:#313131;text-decoration:underline;text-decoration-color:#313131;letter-spacing:0.05px;white-space:nowrap;border:0;outline:none;mso-style-name:'watch showreel';">watch showreel</a>
          </td>

        </tr>
      </table>
    </td>

  </tr>

  <!-- ─────────────────────────────────────────────────────────
       ROW 2 · Confidentiality disclaimer
       ───────────────────────────────────────────────────────── -->
  <tr>
    <td colspan="2" style="padding:25px 20px 24px 25px;mso-padding-alt:25px 20px 24px 25px;">
      <p style="margin:0;padding:0;font-family:Arial,Helvetica,sans-serif;font-size:7px;line-height:8px;color:#797A83;letter-spacing:0.035px;mso-line-height-rule:exactly;">This email and any attachments are confidential and intended for the named recipient only. Let&#8217;s Be Friends Studio (Pty) Ltd accepts no liability for any loss arising from this communication. If received in error, please notify the sender and delete immediately.</p>
    </td>
  </tr>

</table>

</body>
</html>
